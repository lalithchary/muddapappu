name: Persist Affiliate Config

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Affiliate config JSON'
        required: true
      timestamp:
        description: 'Timestamp for the change'
        required: false

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Save affiliate config
        run: |
          # Write the config file from input
          mkdir -p data/store
          echo '${{ github.event.inputs.config }}' > data/store/affiliate-config.json
          cat data/store/affiliate-config.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/store/affiliate-config.json
          if ! git diff --quiet; then
            git commit -m "Update affiliate config - ${{ github.event.inputs.timestamp || (date +%Y-%m-%d) }}"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit"
          fi