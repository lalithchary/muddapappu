name: Sync Cuelinks Deals

on:
  schedule:
    # Run every 5 minutes for near-real-time deal updates
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync deals from Cuelinks
        run: npm run sync:cuelinks
        env:
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
          DATA_DIR: data/store

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git rebase origin/main || true
          git add data/store/deals.json data/store/coupons.json data/store/comments.json
          git commit -m "Sync Cuelinks deals - auto"
          git push origin main